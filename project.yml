name: Mori
options:
  minimumXcodeGenVersion: "2.45.4"
  bundleIdPrefix: com.mettalabs
  deploymentTarget:
    iOS: "16.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "VU5N8NSBSN"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.9.1

targets:
  Mori:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
        excludes:
          - "**/*.md"
      - path: Models
      - path: DesignSystem
        excludes:
          - MoriDesignSystemDocumentation.md
      - path: Services
      - path: Shared
      - path: Localization
    dependencies:
      - package: PostHog
      - sdk: AppIntents.framework
      - target: MoriWidgets
        embed: true
      - target: MoriScreenTimeMonitor
        embed: true
      - target: MoriShieldConfiguration
        embed: true
      - target: MoriShieldAction
        embed: true
      - target: MoriWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mettalabs.mori
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Mori/Mori.entitlements
        INFOPLIST_FILE: Mori/Info.plist
        MORI_PULSE_PROXY_BASE_URL: "https://mori-gray.vercel.app"
        MORI_POSTHOG_API_KEY: ""
        MORI_POSTHOG_HOST: "https://eu.i.posthog.com"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Mori
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"
        INFOPLIST_KEY_MORI_PULSE_PROXY_BASE_URL: "$(MORI_PULSE_PROXY_BASE_URL)"
        INFOPLIST_KEY_MORI_POSTHOG_API_KEY: "$(MORI_POSTHOG_API_KEY)"
        INFOPLIST_KEY_MORI_POSTHOG_HOST: "$(MORI_POSTHOG_HOST)"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Mori can read Apple Health data you approve, including HRV, heart rate, resting heart rate, sleep, respiratory rate, temperature, workouts, active energy, and walking or running distance, to personalize recovery readiness and attention signals."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Mori does not write data to Apple Health. Recovery features only read the Apple Health data you approve."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Mori lets you choose photos to attach to your private journal entries."

  MoriScreenTimeMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenTimeMonitor
      - path: Services/BeforeFeedGateStore.swift
      - path: Services/AttentionShieldActivityNames.swift
      - path: Services/AttentionShieldActiveSessionStore.swift
      - path: Services/AttentionShieldApplier.swift
      - path: Services/AttentionShieldPassiveGatePolicy.swift
      - path: Services/AttentionShieldStateStore.swift
      - path: Services/ScreenTimeSelectionPersistence.swift
      - path: Services/ScreenTimeSelectionStore.swift
      - path: Shared
      - path: Localization
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mettalabs.mori.screentimemonitor
        CODE_SIGN_ENTITLEMENTS: ScreenTimeMonitor/MoriScreenTimeMonitor.entitlements
        INFOPLIST_FILE: ScreenTimeMonitor/Info.plist
        SKIP_INSTALL: YES

  MoriShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfiguration
      - path: Services/AttentionShieldStateStore.swift
      - path: Shared
      - path: Localization
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mettalabs.mori.shieldconfiguration
        CODE_SIGN_ENTITLEMENTS: ShieldConfiguration/MoriShieldConfiguration.entitlements
        INFOPLIST_FILE: ShieldConfiguration/Info.plist
        SKIP_INSTALL: YES

  MoriShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldAction
      - path: Services/BeforeFeedGateStore.swift
      - path: Services/AttentionShieldStateStore.swift
      - path: Shared
      - path: Localization
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mettalabs.mori.shieldaction
        CODE_SIGN_ENTITLEMENTS: ShieldAction/MoriShieldAction.entitlements
        INFOPLIST_FILE: ShieldAction/Info.plist
        SKIP_INSTALL: YES

  MoriWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mettalabs.mori.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/MoriWidgets.entitlements
        INFOPLIST_FILE: Widgets/Info.plist
        SKIP_INSTALL: YES

  MoriWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
      - path: Localization
    dependencies:
      - target: MoriWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mettalabs.mori.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_ENTITLEMENTS: WatchApp/MoriWatch.entitlements
        INFOPLIST_FILE: WatchApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  MoriWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: Shared
      - path: Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mettalabs.mori.watch.widgets
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/MoriWatchWidgets.entitlements
        INFOPLIST_FILE: WatchWidgets/Info.plist
        SKIP_INSTALL: YES

  MoriTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MoriTests
    dependencies:
      - target: Mori
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mettalabs.mori.tests
        GENERATE_INFOPLIST_FILE: YES

  MoriUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MoriUITests
    dependencies:
      - target: Mori
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mettalabs.mori.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Mori:
    build:
      targets:
        Mori: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - MoriTests
        - MoriUITests

  MoriWidgets:
    build:
      targets:
        MoriWidgets: all
    run:
      config: Debug
      askForAppToLaunch: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MoriWatch:
    build:
      targets:
        MoriWatch: all
        MoriWatchWidgets: all
    run:
      config: Debug
    profile:
      config: Release
      executable: MoriWatch
    analyze:
      config: Debug
    archive:
      config: Release
