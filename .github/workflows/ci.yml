name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Install pinned XcodeGen
      env:
        XCODEGEN_VERSION: "2.45.4"
        XCODEGEN_SHA256: "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"
      run: |
        tool_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
        mkdir -p "$tool_root"
        curl --fail --location --retry 3 \
          --output "$tool_root/xcodegen.zip" \
          "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
        printf '%s  %s\n' "$XCODEGEN_SHA256" "$tool_root/xcodegen.zip" |
          shasum -a 256 --check
        unzip -q "$tool_root/xcodegen.zip" -d "$tool_root"
        echo "$tool_root/xcodegen/bin" >> "$GITHUB_PATH"

    - name: Show XcodeGen version
      run: xcodegen --version

    - name: Install design audit Python dependencies
      run: |
        audit_venv="$RUNNER_TEMP/mori-design-audit-venv"
        python3 -m venv "$audit_venv"
        "$audit_venv/bin/python" -m pip install "Pillow==12.1.1"
        echo "$audit_venv/bin" >> "$GITHUB_PATH"

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.7.0
        run_install: false

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: www/pnpm-lock.yaml

    - name: Install web dependencies
      working-directory: www
      run: pnpm install --frozen-lockfile

    - name: Check repository hygiene
      run: bash scripts/check_repo_hygiene.sh

    - name: Test web
      working-directory: www
      run: pnpm test

    - name: Build web app
      working-directory: www
      run: pnpm build:app

    - name: Build web component library
      working-directory: www
      run: pnpm build:library

    - name: Check reproducible redesign release readiness
      env:
        MORI_DERIVED_DATA_PATH: ${{ runner.temp }}/mori-derived-data
      run: bash scripts/check_redesign_release_readiness.sh --skip-web-build

    - name: Test full native Mori scheme
      env:
        MORI_DERIVED_DATA_PATH: ${{ runner.temp }}/mori-derived-data
        MORI_NATIVE_TEST_LOG: ${{ runner.temp }}/MoriTests.log
        MORI_TEST_RESULTS_PATH: ${{ runner.temp }}/MoriTests.xcresult
      run: bash scripts/run_native_tests.sh

    - name: Upload native test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Mori-native-test-results
        path: |
          ${{ runner.temp }}/MoriTests.log
          ${{ runner.temp }}/MoriTests.xcresult
        if-no-files-found: warn
        retention-days: 14

  deploy:
    needs: build
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Validate release credentials and signing configuration
      env:
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      run: |
        missing_secrets=()
        for secret_name in \
          APP_STORE_CONNECT_API_KEY_BASE64 \
          APP_STORE_CONNECT_API_KEY_ID \
          APP_STORE_CONNECT_API_ISSUER_ID; do
          if [ -z "${!secret_name:-}" ]; then
            missing_secrets+=("$secret_name")
          fi
        done

        if [ "${#missing_secrets[@]}" -gt 0 ]; then
          printf '::error::Missing required GitHub Actions secrets: %s\n' "${missing_secrets[*]}"
          printf 'Configure a Team App Store Connect API key with Certificates, Identifiers & Profiles access.\n'
          exit 1
        fi

        project_team="$(
          awk -F '"' '/^[[:space:]]+DEVELOPMENT_TEAM:/ { print $2; exit }' project.yml
        )"
        export_team="$(/usr/libexec/PlistBuddy -c 'Print :developmentTeam' exportOptions.plist)"
        if [ -z "$project_team" ] || [ "$project_team" != "$export_team" ]; then
          printf '::error::project.yml and exportOptions.plist must declare the same development team.\n'
          exit 1
        fi

    - name: Prepare App Store Connect API key
      env:
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      run: |
        api_key_path="$RUNNER_TEMP/mori-app-store-connect-api-key.p8"
        printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$api_key_path"
        chmod 600 "$api_key_path"
        if ! openssl pkey -in "$api_key_path" -noout >/dev/null 2>&1; then
          printf '::error::APP_STORE_CONNECT_API_KEY_BASE64 is not a valid base64-encoded .p8 private key.\n'
          exit 1
        fi

    - name: Build for archive
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      run: |
        xcodebuild -project Mori.xcodeproj \
          -scheme Mori \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/Mori.xcarchive \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$RUNNER_TEMP/mori-app-store-connect-api-key.p8" \
          -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
          -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
          archive

    - name: Export .ipa
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      run: |
        xcodebuild -exportArchive \
          -archivePath build/Mori.xcarchive \
          -exportPath build/output \
          -exportOptionsPlist exportOptions.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$RUNNER_TEMP/mori-app-store-connect-api-key.p8" \
          -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
          -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mori-ipa
        path: build/output/Mori.ipa
        if-no-files-found: error

    - name: Remove App Store Connect API key
      if: always()
      run: rm -f -- "$RUNNER_TEMP/mori-app-store-connect-api-key.p8"
