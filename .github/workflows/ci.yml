name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Install pinned XcodeGen
      env:
        XCODEGEN_VERSION: "2.45.4"
        XCODEGEN_SHA256: "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef"
      run: |
        tool_root="$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
        mkdir -p "$tool_root"
        curl --fail --location --retry 3 \
          --output "$tool_root/xcodegen.zip" \
          "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
        printf '%s  %s\n' "$XCODEGEN_SHA256" "$tool_root/xcodegen.zip" |
          shasum -a 256 --check
        unzip -q "$tool_root/xcodegen.zip" -d "$tool_root"
        echo "$tool_root/xcodegen/bin" >> "$GITHUB_PATH"

    - name: Show XcodeGen version
      run: xcodegen --version

    - name: Install design audit Python dependencies
      run: |
        audit_venv="$RUNNER_TEMP/mori-design-audit-venv"
        python3 -m venv "$audit_venv"
        "$audit_venv/bin/python" -m pip install "Pillow==12.1.1"
        echo "$audit_venv/bin" >> "$GITHUB_PATH"

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.7.0
        run_install: false

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: www/pnpm-lock.yaml

    - name: Install web dependencies
      working-directory: www
      run: pnpm install --frozen-lockfile

    - name: Check repository hygiene
      run: bash scripts/check_repo_hygiene.sh

    - name: Test web
      working-directory: www
      run: pnpm test

    - name: Build web app
      working-directory: www
      run: pnpm build:app

    - name: Build web component library
      working-directory: www
      run: pnpm build:library

    - name: Check reproducible redesign release readiness
      run: bash scripts/check_redesign_release_readiness.sh --skip-web-build

  deploy:
    needs: build
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Build for archive
      run: |
        xcodebuild -project Mori.xcodeproj \
          -scheme Mori \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/Mori \
          DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }} \
          archive

    - name: Export .ipa
      run: |
        # Update exportOptions with DEVELOPMENT_TEAM
        /usr/libexec/PlistBuddy -c "Set :signingStyle manual" exportOptions.plist
        /usr/libexec/PlistBuddy -c "Set :developmentTeam ${{ secrets.DEVELOPMENT_TEAM }}" exportOptions.plist
        /usr/libexec/PlistBuddy -c "Set :signingCertificate 'Apple Distribution'" exportOptions.plist
        /usr/libexec/PlistBuddy -c "Set :method 'ad-hoc'" exportOptions.plist

        xcodebuild -exportArchive \
          -archivePath build/Mori.xcarchive \
          -exportPath build/output \
          -exportOptionsPlist exportOptions.plist

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Mori-ipa
        path: build/output/Mori.ipa
